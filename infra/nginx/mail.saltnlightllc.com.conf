# /etc/nginx/conf.d/mail.saltnlightllc.com.conf
#
# Salt & Light webmail (OrdoNuntius) + OrdoEpistola JMAP/admin/metrics
# co-located on the email-lab EC2 instance at mail.saltnlightllc.com.
#
# Before this config is installed, OrdoEpistola owned :443 directly.
# After install, nginx terminates TLS on :443 and forwards to:
#   - OrdoEpistola HTTPS (JMAP, admin, metrics, .well-known) on 127.0.0.1:8443
#   - OrdoNuntius Next.js standalone server on 127.0.0.1:3000
#
# SMTP (25, 465, 587), IMAPS (993), and ManageSieve (4190) continue to be
# served by OrdoEpistola directly — those are not HTTP and do not pass
# through nginx. See infra/runbooks/nginx-cutover.md for the one-time
# OrdoEpistola listener reconfiguration that makes this safe.

# -----------------------------------------------------------------------------
# :80 — ACME challenge + redirect everything else to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mail.saltnlightllc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# :443 — TLS termination, route by URI to OrdoEpistola or OrdoNuntius
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mail.saltnlightllc.com;

    ssl_certificate     /etc/letsencrypt/live/mail.saltnlightllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mail.saltnlightllc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # JMAP requests carry full message bodies and attachments.
    # 50m matches OrdoEpistola's default JMAP upload limit; adjust together.
    client_max_body_size 50m;

    # Hide dotfiles other than .well-known.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # OrdoEpistola surfaces. Order matters: these all match before location /
    # which is the OrdoNuntius catch-all.
    # -------------------------------------------------------------------------

    # JMAP core. Carries the long-poll EventSource and WebSocket upgrade.
    location = /jmap {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /jmap/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # JMAP / autoconfig / autodiscover service discovery.
    location ^~ /.well-known/jmap {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/caldav {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/carddav {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/mta-sts.txt {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /.well-known/autoconfig/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /autodiscover/autodiscover.xml {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /mail/config-v1.1.xml {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # CalDAV / CardDAV / WebDAV.
    location /dav/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
    }

    # OrdoEpistola admin HTTP API (server-side OrdoEpistola admin endpoints,
    # NOT to be confused with the OrdoNuntius admin dashboard which lives at
    # /admin on the Next.js side). The OrdoEpistola admin API surface lives
    # under /api/ on its HTTP listener.
    location /api/principal {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/domain {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/queue {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/report {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/store {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus scrape endpoint (basic auth on the OrdoEpistola side).
    location /metrics/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth 2.0 / OIDC discovery + endpoints served by OrdoEpistola when used
    # as the IdP. The actual endpoints live under /auth/ (token, introspect,
    # userinfo, register, jwks.json, device) plus the user-facing
    # authorization page at the configured login segment, e.g. /oauth-login.
    # That segment is set by ORDO_EPISTOLA_OAUTH_LOGIN_SEGMENT on the
    # OrdoEpistola side; nginx must mirror the same value here. The default
    # below assumes "oauth-login" — change if you set a different segment.
    location = /.well-known/openid-configuration {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /auth/ {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /oauth-login {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -------------------------------------------------------------------------
    # OrdoNuntius (Next.js standalone) — catch-all.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

# Required for $connection_upgrade above. Drop into /etc/nginx/conf.d/ or
# /etc/nginx/nginx.conf http{} block. install-ordo-nuntius.sh handles this.
