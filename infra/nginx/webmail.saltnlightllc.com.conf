# /etc/nginx/conf.d/webmail.saltnlightllc.com.conf
#
# OrdoNuntius webmail on saltnlight-prod (16.58.52.6), with same-origin
# proxying to OrdoEpistola JMAP on the email-lab box
# (mail.saltnlightllc.com / 16.58.225.15).
#
# Why proxy same-origin instead of letting the browser cross-origin to
# mail.saltnlightllc.com: OrdoEpistola does NOT emit
# Access-Control-Allow-Origin response headers. A browser making JMAP
# requests directly to mail.saltnlightllc.com from a page served at
# webmail.saltnlightllc.com would be blocked. By proxying JMAP/auth/
# .well-known through this nginx, the browser only ever talks to
# webmail.saltnlightllc.com — same origin. The cross-instance hop is
# server-to-server (nginx -> 16.58.225.15:443).

upstream ordoepistola_jmap {
    server mail.saltnlightllc.com:443;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# :80 — ACME challenge + redirect everything else to HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name webmail.saltnlightllc.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# :443 — TLS termination, OrdoNuntius UI + same-origin proxy to OrdoEpistola
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name webmail.saltnlightllc.com;

    ssl_certificate     /etc/letsencrypt/live/webmail.saltnlightllc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webmail.saltnlightllc.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # OrdoEpistola pass-throughs. Browser thinks these are local to
    # webmail.saltnlightllc.com (same-origin); nginx forwards them to the
    # mail box via TLS. Host header is set to mail.saltnlightllc.com so
    # OrdoEpistola routes correctly and emits the right URLs in its OIDC
    # discovery responses (the issuer claim still points at mail., which
    # is correct — the OAuth client is configured with that issuer).
    # -------------------------------------------------------------------------

    location = /jmap {
        proxy_pass https://ordoepistola_jmap;
        proxy_ssl_server_name on;
        proxy_set_header Host mail.saltnlightllc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /jmap/ {
        proxy_pass https://ordoepistola_jmap;
        proxy_ssl_server_name on;
        proxy_set_header Host mail.saltnlightllc.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # .well-known/jmap discovery: OrdoEpistola does NOT serve this endpoint
    # (Stalwart exposes the session document at /jmap/session directly).
    # RFC 8620 says JMAP clients fetch /.well-known/jmap and expect either
    # the session JSON or a redirect to it. Synthesize the 307 here so
    # client discovery succeeds without involving the upstream — proxying
    # /.well-known/jmap through to mail.saltnlightllc.com would 404 and
    # break login with "Failed to get session: 404" in the browser console.
    location = /.well-known/jmap {
        return 307 /jmap/session;
    }
    location = /.well-known/openid-configuration {
        proxy_pass https://ordoepistola_jmap;
        proxy_ssl_server_name on;
        proxy_set_header Host mail.saltnlightllc.com;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /.well-known/oauth-authorization-server {
        proxy_pass https://ordoepistola_jmap;
        proxy_ssl_server_name on;
        proxy_set_header Host mail.saltnlightllc.com;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /auth/ {
        proxy_pass https://ordoepistola_jmap;
        proxy_ssl_server_name on;
        proxy_set_header Host mail.saltnlightllc.com;
        proxy_set_header X-Forwarded-Proto https;
    }

    # -------------------------------------------------------------------------
    # Static assets — bypass the Node.js loopback entirely.
    #
    # Next.js can serve these itself, but every hop costs: nginx → Node →
    # back to nginx → wire. Serving them directly from disk saves the
    # loopback round-trip (a few ms × every chunk × every cold load).
    #
    # The .br precompressed variants land next to each text asset at pack
    # time (xtask/index.mjs::precompressBrotli) at brotli quality 11,
    # which nginx serves directly via brotli_static — zero compression CPU
    # per request and ~10-15% smaller than on-the-fly brotli quality 5.
    #
    # Cache-Control: Next chunk filenames are content-hashed, so
    # immutable + 1y is safe. Brand assets are also versioned by URL
    # (faviconUrl etc. come from configManager) so 1y is fine; the
    # rare rebrand publishes a new URL.
    # -------------------------------------------------------------------------
    location /_next/static/ {
        alias /opt/ordonuntius/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        brotli_static on;
        gzip_static on;
        try_files $uri =404;
    }

    location /branding/ {
        alias /opt/ordonuntius/current/public/branding/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        brotli_static on;
        gzip_static on;
        try_files $uri =404;
    }

    # -------------------------------------------------------------------------
    # OrdoNuntius (Next.js) — catch-all for everything not served above.
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # X-Forwarded-Proto intentionally cleared (NOT $scheme). Next-intl
        # middleware does an internal fetch back to 127.0.0.1:3000 using
        # whatever scheme it perceives the request as. With $scheme=https,
        # Node tries to TLS-handshake against the local HTTP server and
        # fails with EPROTO ("packet length too long"), producing 500
        # "Internal Server Error" on every page render. Empty value
        # disables the header so Next.js falls back to detecting the
        # scheme from the actual loopback socket (http) and stays
        # internally consistent. The browser still talks HTTPS to nginx;
        # only the loopback hop is unaffected by this clear.
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
