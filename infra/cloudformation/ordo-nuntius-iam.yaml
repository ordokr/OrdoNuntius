AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  OrdoNuntius additive AWS resources for the Salt & Light webmail. This
  stack does NOT create an EC2 instance — OrdoNuntius runs on the existing
  saltnlight-prod EC2 instance (i-0a7d30a49197243b1) alongside
  hybridportalecosystem. OrdoEpistola JMAP is on a SEPARATE instance
  (email-lab, i-0a462d2c5eb1ba39e); webmail reaches it cross-instance.
  The template only adds:
    1. An IAM managed policy granting the saltnlight-prod instance role
       permission to read /saltnlight/webmail/<env>/* SSM parameters.
    2. A CloudWatch log group for OrdoNuntius journal shipping.
    3. CloudWatch alarms scoped to the saltnlight-prod instance.
  Attach the managed policy to the existing instance role out of band
  (the role name is an input parameter).

Parameters:
  Environment:
    Type: String
    AllowedValues: [email-lab, staging, prod]
    Default: email-lab
    Description: Deployment environment — used as the SSM parameter prefix segment.

  HostInstanceRoleName:
    Type: String
    Description: Name of the existing IAM role attached to the saltnlight-prod
      EC2 instance. The new managed policy is attached to this role so
      OrdoNuntius (running on saltnlight-prod) inherits SSM read access.

  InstanceId:
    Type: String
    Default: i-0a7d30a49197243b1
    Description: ID of the saltnlight-prod EC2 instance that hosts OrdoNuntius.
      Used as a dimension on the CloudWatch alarms.

  AlertSnsTopicArn:
    Type: String
    Default: ''
    Description: SNS topic ARN that receives alarm notifications. Optional —
      if empty, alarms are created without notification routing and only show
      in the console.

Conditions:
  HasAlertTopic: !Not [!Equals [!Ref AlertSnsTopicArn, '']]

Resources:

  ###########################################################################
  # IAM — additive managed policy for the OrdoEpistola instance role
  ###########################################################################

  WebmailSsmReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub ordo-nuntius-${Environment}-ssm-read
      Description: !Sub Read /saltnlight/webmail/${Environment}/* parameters from SSM.
      Roles:
        - !Ref HostInstanceRoleName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
            Resource:
              - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/saltnlight/webmail/${Environment}/*
          - Effect: Allow
            Action:
              - kms:Decrypt
            Resource: '*'
            Condition:
              StringEquals:
                kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
            Resource:
              - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/saltnlight/webmail/${Environment}/ordo-nuntius:*

  ###########################################################################
  # CloudWatch — log group for journalctl shipping
  ###########################################################################

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /saltnlight/webmail/${Environment}/ordo-nuntius
      RetentionInDays: 30

  ###########################################################################
  # CloudWatch — alarms (mirror OrdoEpistola alarm posture)
  ###########################################################################

  # Custom metric `OrdoNuntiusServiceActive` published by a unified
  # cloudwatch-agent rule on the host. Value 1 when active, 0 when down.
  # The publisher config lives in the unified-cloudwatch-agent config on
  # the email-lab box, alongside the existing OrdoEpistola publisher.
  ServiceInactiveAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ordonuntius-${Environment}-service-inactive
      AlarmDescription: OrdoNuntius systemd unit is not active
      Namespace: Saltnlight/Webmail
      MetricName: OrdoNuntiusServiceActive
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
        - Name: Environment
          Value: !Ref Environment
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: !If [HasAlertTopic, [!Ref AlertSnsTopicArn], !Ref 'AWS::NoValue']
      OKActions:     !If [HasAlertTopic, [!Ref AlertSnsTopicArn], !Ref 'AWS::NoValue']

  # Composite alarm: webmail is degraded when host CPU is high AND the
  # webmail systemd unit is down. Reuses saltnlight-prod-cpu-high (already
  # present from the production-portal CloudWatch posture) as the CPU
  # signal — same host, so the existing alarm is the correct one.
  DegradedComposite:
    Type: AWS::CloudWatch::CompositeAlarm
    Properties:
      AlarmName: !Sub ordonuntius-${Environment}-degraded
      AlarmDescription: >-
        Webmail is degraded — composite of high host CPU AND service inactive.
      AlarmRule: !Sub
        - 'ALARM("saltnlight-prod-cpu-high") AND ALARM("${ServiceAlarmName}")'
        - ServiceAlarmName: !Ref ServiceInactiveAlarm
      ActionsEnabled: true
      AlarmActions: !If [HasAlertTopic, [!Ref AlertSnsTopicArn], !Ref 'AWS::NoValue']
      OKActions:     !If [HasAlertTopic, [!Ref AlertSnsTopicArn], !Ref 'AWS::NoValue']

Outputs:
  WebmailSsmReadPolicyArn:
    Description: ARN of the managed policy granting SSM read for /saltnlight/webmail/<env>/*.
    Value: !Ref WebmailSsmReadPolicy

  LogGroupName:
    Description: CloudWatch log group for OrdoNuntius journal shipping.
    Value: !Ref LogGroup

  SsmPrefix:
    Description: SSM parameter prefix the install script reads.
    Value: !Sub /saltnlight/webmail/${Environment}
